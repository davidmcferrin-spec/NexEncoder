# Operator pages. Apache and PHP on loopback. The Python feed stays on 127.0.0.1:8788.
<VirtualHost 127.0.0.1:8780>
    ServerName nexencoder.localhost
    DocumentRoot /var/lib/nexencoder/www

    <Directory /var/lib/nexencoder/www>
        Require all granted
        AllowOverride None
        Options -Indexes +FollowSymLinks
        DirectoryIndex index.php
    </Directory>

    <Directory /var/lib/nexencoder/www/includes>
        Require all denied
    </Directory>

    RewriteEngine On
    RewriteRule ^/(index|inputs|outputs|monitor|effects|metrics|services)\.html$ /$1.php [R=302,L]

    ProxyRequests Off
    ProxyPreserveHost Off
    ProxyTimeout 7200
    ProxyPass /api/ http://127.0.0.1:8788/api/ flushpackets=on timeout=7200
    ProxyPassReverse /api/ http://127.0.0.1:8788/api/
    ProxyPassMatch "^/metrics$" "http://127.0.0.1:8788/metrics" timeout=10
    ProxyPassReverse /metrics http://127.0.0.1:8788/metrics

    php_admin_flag allow_url_fopen On

    Header always set Cache-Control "no-store"
    Header always set X-Content-Type-Options "nosniff"
</VirtualHost>
