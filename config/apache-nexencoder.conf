# Operator pages on port 80. Apache serves the PHP and static files.
# The live feed stays on 127.0.0.1:8788 and is called by PHP, not by this server.
<VirtualHost *:80>
    ServerName nexencoder
    DocumentRoot /var/lib/nexencoder/www

    <Directory /var/lib/nexencoder/www>
        Require all granted
        AllowOverride None
        Options -Indexes +FollowSymLinks
        DirectoryIndex index.php
    </Directory>

    <Directory /var/lib/nexencoder/www/includes>
        Require all denied
    </Directory>

    RewriteEngine On
    RewriteRule ^/(index|inputs|outputs|monitor|effects|metrics|services)\.html$ /$1.php [R=302,L]

    php_admin_flag allow_url_fopen On

    Header always set Cache-Control "no-store"
    Header always set X-Content-Type-Options "nosniff"
</VirtualHost>
