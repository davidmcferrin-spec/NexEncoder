# NexEncoder preview broker. ffmpeg publishes RTSP on localhost.
# The monitor page plays WebRTC (WHEP) from webrtcAddress.
logLevel: info
rtsp: true
rtspAddress: 127.0.0.1:8554
rtmp: false
hls: false
webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
# A publisher that has just joined is quiet until the next keyframe.
# The default 10s closed that RTSP session.
readTimeout: 30s
writeTimeout: 30s
api: false

paths:
  inputA:
  inputB:
