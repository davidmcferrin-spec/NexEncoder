<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bug</title>
  <style>
    html { color-scheme: normal; background: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    .fade {
      position: absolute;
      top: 10%;
      right: 6%;
      width: 28%;
      height: 12%;
      background: linear-gradient(90deg, rgba(62, 207, 142, 0.95), rgba(62, 207, 142, 0));
    }
    .bug {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 8%;
      padding: 0.6rem 1rem;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font: 600 42px/1.2 sans-serif;
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      50% { opacity: 0.45; }
    }
  </style>
</head>
<body>
  <div class="fade"></div>
  <div class="bug">NexEncoder</div>
</body>
</html>
